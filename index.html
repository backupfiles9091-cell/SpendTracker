<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mis Gastos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f9d73">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mis Gastos">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="month-nav">
      <button id="prev-month" aria-label="Mes anterior">‹</button>
      <h1 id="month-label">Mes</h1>
      <button id="next-month" aria-label="Mes siguiente">›</button>
    </div>
  </header>

  <main>
    <!-- INICIO -->
    <section id="view-home" class="view active">
      <div class="card summary">
        <div class="label">Balance del mes</div>
        <div class="balance" id="sum-balance">$0.00</div>
        <div class="row">
          <div><span class="dot inc"></span>Ingresos<strong id="sum-income">$0.00</strong></div>
          <div><span class="dot exp"></span>Gastos<strong id="sum-expense">$0.00</strong></div>
        </div>
      </div>
      <div id="tx-list"></div>
    </section>

    <!-- ESTADÍSTICAS -->
    <section id="view-stats" class="view">
      <div class="card">
        <h2>Gastos por categoría</h2>
        <div id="donut"></div>
        <div id="legend"></div>
      </div>
      <div class="card">
        <h2>Últimos 6 meses</h2>
        <div id="bars"></div>
        <div class="bars-legend"><span><i class="dot inc"></i>Ingresos</span><span><i class="dot exp"></i>Gastos</span></div>
      </div>
    </section>

    <!-- AJUSTES -->
    <section id="view-settings" class="view">
      <div class="card">
        <h2>Moneda</h2>
        <select id="currency">
          <option value="MXN">Peso mexicano (MXN)</option>
          <option value="USD">Dólar estadounidense (USD)</option>
          <option value="EUR">Euro (EUR)</option>
          <option value="COP">Peso colombiano (COP)</option>
          <option value="ARS">Peso argentino (ARS)</option>
          <option value="CLP">Peso chileno (CLP)</option>
          <option value="PEN">Sol peruano (PEN)</option>
        </select>
      </div>
      <div class="card">
        <h2>Tus datos</h2>
        <p class="hint">Todo se guarda solo en este dispositivo. iOS puede borrar los datos de una web si no la usas en semanas, así que exporta un respaldo de vez en cuando.</p>
        <button class="btn" id="btn-export">Exportar respaldo (JSON)</button>
        <button class="btn" id="btn-csv">Exportar a CSV</button>
        <button class="btn" id="btn-import">Importar respaldo</button>
        <input type="file" id="file-import" accept="application/json,.json" hidden>
        <button class="btn danger" id="btn-reset">Borrar todos los datos</button>
      </div>
    </section>
  </main>

  <button id="fab" aria-label="Agregar movimiento">+</button>

  <nav class="tabbar">
    <button data-view="home" class="active"><span>🏠</span>Inicio</button>
    <button data-view="stats"><span>📊</span>Estadísticas</button>
    <button data-view="settings"><span>⚙️</span>Ajustes</button>
  </nav>

  <!-- FORMULARIO -->
  <div id="sheet-backdrop" hidden></div>
  <div id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div class="seg">
      <button data-type="expense" class="active">Gasto</button>
      <button data-type="income">Ingreso</button>
    </div>
    <input id="f-amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
    <div id="f-cats" class="cats"></div>
    <input id="f-date" type="date">
    <input id="f-note" type="text" placeholder="Nota (opcional)" maxlength="80">
    <div class="sheet-actions">
      <button class="btn danger" id="f-delete" hidden>Eliminar</button>
      <button class="btn" id="f-cancel">Cancelar</button>
      <button class="btn primary" id="f-save">Guardar</button>
    </div>
  </div>

  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
